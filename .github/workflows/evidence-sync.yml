name: Evidence Sync

# Continuous evidence is accepted only as the exact byte payload produced by a
# successful Lab Mainline run, deployed by Lab Pages, and then observed live by
# the Lab Evidence Dispatch workflow. The coordinate is source commit +
# Mainline/Pages run ids + evidence/kernel hashes. There is deliberately no raw
# committed-summary, schedule, or branch-tip fallback. Immutable v* releases
# remain owned by the separate pendulum-release workflow and matching tag.

on:
  repository_dispatch:
    types: [evidence-updated]

permissions:
  contents: read

concurrency:
  group: landing-main-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Materialize the exact deployed Lab evidence handoff
        shell: bash
        env:
          HANDOFF_SCHEMA: ${{ github.event.client_payload.schema_version || '' }}
          HANDOFF_POLICY: ${{ github.event.client_payload.coordinate.policy || '' }}
          EXPECTED_SOURCE_COMMIT: ${{ github.event.client_payload.coordinate.source_commit || '' }}
          EXPECTED_PACKAGE_VERSION: ${{ github.event.client_payload.coordinate.package_version || '' }}
          LAB_MAINLINE_RUN_ID: ${{ github.event.client_payload.coordinate.mainline_run_id || '' }}
          LAB_PAGES_RUN_ID: ${{ github.event.client_payload.coordinate.pages_run_id || '' }}
          LAB_PAGES_RUN_ATTEMPT: ${{ github.event.client_payload.coordinate.pages_run_attempt || '' }}
          EXPECTED_EVIDENCE_SHA256: ${{ github.event.client_payload.evidence.sha256 || '' }}
          EVIDENCE_BASE64: ${{ github.event.client_payload.evidence.base64 || '' }}
          EXPECTED_KERNEL_SHA256: ${{ github.event.client_payload.kernel.sha256 || '' }}
          EXPECTED_KERNEL_MANIFEST_SHA256: ${{ github.event.client_payload.kernel.manifest_sha256 || '' }}
          EXPECTED_DEPLOYMENT_MANIFEST_SHA256: ${{ github.event.client_payload.deployment.manifest_sha256 || '' }}
        run: node scripts/materialize-evidence-handoff.mjs
      - name: Materialize and verify the exact Mainline kernel pair
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.client_payload.coordinate.source_commit || '' }}
          EXPECTED_KERNEL_SHA256: ${{ github.event.client_payload.kernel.sha256 || '' }}
          EXPECTED_KERNEL_MANIFEST_SHA256: ${{ github.event.client_payload.kernel.manifest_sha256 || '' }}
          KERNEL_BASE64: ${{ github.event.client_payload.kernel.base64 || '' }}
          KERNEL_MANIFEST_BASE64: ${{ github.event.client_payload.kernel.manifest_base64 || '' }}
        run: node scripts/sync-kernel-manifest.mjs --materialize-handoff
      - name: Synchronize evidence-backed copy and generated page
        run: |
          npm run sync:changelog
          npm run sync:copy
          npm run assets:og-card
          npm run build:ko
      - name: Full static gate against the synced evidence
        env:
          PENDULUM_EXPECTED_SOURCE_COMMIT: ${{ github.event.client_payload.coordinate.source_commit || '' }}
        run: npm run check
      # The smoke suite pins the exact dispatched pair's numeric behavior.
      - run: npm run smoke:ci
      - run: npm run lighthouse:lhci
      - name: Commit and push the sync if anything changed
        shell: bash
        run: |
          if git diff --quiet -- assets/evidence-summary.json assets/pendulum-demo-kernel.js assets/demo-kernel-manifest.json assets/changelog-highlights.json assets/i18n-core.js assets/og-card.png assets/og-card-meta.json index.html ko.html sitemap.xml; then
            echo "evidence already in sync; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_commit="$(node -e "process.stdout.write(require('./assets/evidence-summary.json').provenance.sourceCommit.slice(0, 12))")"
          pages_run_id="${{ github.event.client_payload.coordinate.pages_run_id }}"
          [[ "$pages_run_id" =~ ^[1-9][0-9]*$ ]]
          git add -- assets/evidence-summary.json assets/pendulum-demo-kernel.js assets/demo-kernel-manifest.json assets/changelog-highlights.json assets/i18n-core.js assets/og-card.png assets/og-card-meta.json index.html ko.html sitemap.xml
          git commit -m "chore: sync deployed evidence from pendulum-lab@${source_commit} (Pages run ${pages_run_id})"
          git push
      - name: Confirm the validated source tree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"
      - name: Prepare the exact site that passed the producer gate
        run: npm run prepare:site
      - name: Record the validated source commit
        shell: bash
        run: git rev-parse HEAD > validated-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-validated-site
          path: |
            _site
            validated-source-sha.txt
          if-no-files-found: error
          retention-days: 2
      - name: Preserve the received Lab evidence coordinate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landing-evidence-handoff-${{ github.run_id }}
          path: reports/deployment/lab-evidence-handoff.json
          if-no-files-found: warn
          retention-days: 90
