name: Cloudflare Pages mirror

on:
  # The mirror is optional and credentialed. An explicit dispatch fails closed
  # when configuration is missing without making every GitHub Pages push red.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: cloudflare-pages
    steps:
      - name: Require an explicitly configured mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MIRROR_URL: ${{ vars.CLOUDFLARE_MIRROR_URL }}
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_MIRROR_URL" ] || missing+=(CLOUDFLARE_MIRROR_URL)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '## Cloudflare mirror: blocked\n\nMissing configuration: `%s`.\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare mirror is required but not configured: ${missing[*]}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      # build:ko renders index.html in headless Chromium, so browsers must be
      # installed before it (this workflow's first live run failed here).
      - run: npx playwright install --with-deps chromium
      - run: npm run build:hero
      - run: npm run build:ko
      - run: git diff --exit-code -- assets/scene.bundle.js ko.html
      - run: npm run check
      - run: npx playwright test tests/landing-smoke.spec.ts tests/hero-runtime.spec.ts --project=chromium --project=mobile-chrome --workers=1 --reporter=list
      - run: npm run lighthouse:lhci
      - name: Prepare static mirror artifact
        run: npm run prepare:site -- --headers
      - name: Deploy mirror with custom isolation headers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npm exec --no -- wrangler pages deploy _site --project-name pendulum-landing --branch "${GITHUB_REF_NAME}"
      - name: Verify deployed isolation and security headers
        env:
          CLOUDFLARE_MIRROR_URL: ${{ vars.CLOUDFLARE_MIRROR_URL }}
        shell: bash
        run: |
          mkdir -p reports/deployment
          mirror_ko_url="$(node -e "const u=new URL('ko.html?lang=ko', process.argv[1]); if(u.protocol!=='https:') throw new Error('CLOUDFLARE_MIRROR_URL must use HTTPS'); process.stdout.write(u.href)" "$CLOUDFLARE_MIRROR_URL")"
          contract_passed=false
          for attempt in $(seq 1 12); do
            echo "live mirror contract attempt ${attempt}/12"
            if ! curl --fail --silent --show-error --retry 5 --retry-all-errors --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 60 \
              --dump-header reports/deployment/cloudflare-en-headers.txt \
              --output reports/deployment/cloudflare-en.html \
              "$CLOUDFLARE_MIRROR_URL"; then
              echo "EN mirror fetch failed on attempt ${attempt}; retrying the bounded poll" >&2
              sleep 10
              continue
            fi
            if ! curl --fail --silent --show-error --retry 5 --retry-all-errors --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 60 \
              --dump-header reports/deployment/cloudflare-ko-headers.txt \
              --output reports/deployment/cloudflare-ko.html \
              "$mirror_ko_url"; then
              echo "KO mirror fetch failed on attempt ${attempt}; retrying the bounded poll" >&2
              sleep 10
              continue
            fi
            if node scripts/check-deployment-headers.mjs \
              reports/deployment/cloudflare-header-contract.json \
              "$CLOUDFLARE_MIRROR_URL" \
              reports/deployment/cloudflare-en-headers.txt \
              reports/deployment/cloudflare-en.html \
              reports/deployment/cloudflare-ko-headers.txt \
              reports/deployment/cloudflare-ko.html; then
              contract_passed=true
              break
            fi
            sleep 10
          done
          if [ "$contract_passed" != true ]; then
            echo "Cloudflare mirror did not converge to the exact EN/KO artifact and header contract" >&2
            exit 1
          fi
          printf '## Cloudflare mirror: verified\n\n%s returned the full hardened header contract.\n' "$CLOUDFLARE_MIRROR_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloudflare-header-contract
          path: |
            reports/deployment
            test-results
          if-no-files-found: warn
