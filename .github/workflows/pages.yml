name: Deploy landing to GitHub Pages

on:
  workflow_run:
    workflows: ["Landing CI", "Evidence Sync", "Cross-repository release"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: landing-pages-main
  cancel-in-progress: true

jobs:
  quality-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'Landing CI' &&
      github.event.workflow_run.event == 'push') ||
      (github.event.workflow_run.name == 'Evidence Sync' &&
      (github.event.workflow_run.event == 'repository_dispatch' ||
      github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule')) ||
      (github.event.workflow_run.name == 'Cross-repository release' &&
      (github.event.workflow_run.event == 'repository_dispatch' ||
      github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the exact site that passed its producer gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landing-validated-site
          path: validated-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify exact artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          artifact_sha="$(tr -d '\r\n' < validated-handoff/validated-source-sha.txt)"
          [[ "$artifact_sha" =~ ^[0-9a-f]{40}$ ]]
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$artifact_sha" = "$current_sha"
          if [ "$SOURCE_WORKFLOW" = "Landing CI" ]; then
            test "$artifact_sha" = "$RUN_HEAD_SHA"
          fi
          test -s validated-handoff/_site/index.html
          test -s validated-handoff/_site/ko.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: validated-handoff/_site
      - name: Record the deployed journey mode
        shell: bash
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          node -e "const fs=require('node:fs'); const e=JSON.parse(fs.readFileSync('validated-handoff/_site/assets/evidence-summary.json','utf8')); const strict=['Evidence Sync','Cross-repository release'].includes(process.env.SOURCE_WORKFLOW); fs.writeFileSync('deployed-journey-coordinate.json', JSON.stringify({schemaVersion:'pendulum-deployed-journey-coordinate/v1',mode:strict?'strict-coordinate':'landing-ui',sourceWorkflow:process.env.SOURCE_WORKFLOW,sourceCommit:e.provenance.sourceCommit,evidenceSha256:require('node:crypto').createHash('sha256').update(fs.readFileSync('validated-handoff/_site/assets/evidence-summary.json')).digest('hex'),lastSynchronizedAt:e.generatedAt},null,2)+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-journey-coordinate
          path: deployed-journey-coordinate.json
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact artifact that passed its producer gate
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
