name: Deploy landing to GitHub Pages

on:
  workflow_run:
    workflows: ["Landing CI", "Evidence Sync", "Cross-repository release"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: landing-pages-main
  cancel-in-progress: true

jobs:
  quality-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'Landing CI' &&
      github.event.workflow_run.event == 'push') ||
      (github.event.workflow_run.name == 'Evidence Sync' &&
      (github.event.workflow_run.event == 'repository_dispatch' ||
      github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule')) ||
      (github.event.workflow_run.name == 'Cross-repository release' &&
      (github.event.workflow_run.event == 'repository_dispatch' ||
      github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the exact site that passed its producer gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landing-validated-site
          path: validated-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify exact artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          artifact_sha="$(tr -d '\r\n' < validated-handoff/validated-source-sha.txt)"
          [[ "$artifact_sha" =~ ^[0-9a-f]{40}$ ]]
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$artifact_sha" = "$current_sha"
          if [ "$SOURCE_WORKFLOW" = "Landing CI" ]; then
            test "$artifact_sha" = "$RUN_HEAD_SHA"
          fi
          test -s validated-handoff/_site/index.html
          test -s validated-handoff/_site/ko.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: validated-handoff/_site

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact artifact that passed its producer gate
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
