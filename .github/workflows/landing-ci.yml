name: Landing CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:hero
      # ko.html is generated from index.html + the dictionary
      # (scripts/build-ko-page.mjs); fail if the committed page drifted.
      - run: npm run build:ko
      - run: git diff --exit-code -- assets/scene.bundle.js ko.html
      - run: npm run smoke:ci
      - name: Confirm the validated source tree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"
      - name: Prepare the exact site that passed the browser gate
        run: npm run prepare:site
      - name: Record the validated source commit
        shell: bash
        run: git rev-parse HEAD > validated-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-validated-site
          path: |
            _site
            validated-source-sha.txt
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landing-playwright-report
          path: |
            reports/playwright
            test-results
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npm run lighthouse:lhci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landing-lighthouse-report
          path: reports/lighthouse
          if-no-files-found: ignore
